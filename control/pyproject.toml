[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dofus_control"
version = "0.1.0"
description = "macOS window/capture/input/kill-switch layer for dofus-agent (works with any app window)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pyobjc-core>=10.1; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.1; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.1; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.1; sys_platform == 'darwin'",
    "pyobjc-framework-ScreenCaptureKit>=10.1; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
dofus-control = "dofus_control.cli:main"

[tool.setuptools]
packages = ["dofus_control", "dofus_control.macos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
